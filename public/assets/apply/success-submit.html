<style>
  .success-container {
    width: 320px;
    height: 320px;
    position: relative;
  }
  .success-svg {
    width: 100%;
    height: 100%;
  }
  .success-circle {
    fill: none;
    stroke: #DB4429;
    stroke-width: 8;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: drawCircle 0.8s ease-out forwards;
  }
  .success-arch {
    fill: #DB4429;
    transform-origin: center bottom;
    transform: scaleY(0);
    animation: growArch 0.6s ease-out 0.6s forwards;
  }
  .success-check {
    fill: none;
    stroke: #F3EEE3;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    animation: drawCheck 0.5s ease-out 1s forwards;
  }
  .confetti {
    position: absolute;
    width: 8px; height: 8px;
    background: #D8CDB8;
    opacity: 0;
    border-radius: 2px;
  }
  @keyframes drawCircle { to { stroke-dashoffset: 0; } }
  @keyframes growArch { to { transform: scaleY(1); } }
  @keyframes drawCheck { to { stroke-dashoffset: 0; } }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(-60px) rotate(180deg); opacity: 0; }
  }
</style>
<div class="success-container">
  <svg class="success-svg" viewBox="0 0 320 320">

    <path class="success-arch" d="M120 220 L120 140 C120 110 160 110 160 110 C160 110 200 110 200 140 L200 220 Z" />
    <path class="success-check" d="M135 160 L155 180 L185 140" />
  </svg>
  <div class="confetti" style="top: 100px; left: 100px; animation: floatUp 1s ease-out 1.2s forwards;"></div>
  <div class="confetti" style="top: 120px; left: 220px; animation: floatUp 1.2s ease-out 1.3s forwards; background: #DB4429; border-radius:50%;"></div>
  <div class="confetti" style="top: 220px; left: 80px; animation: floatUp 1.1s ease-out 1.4s forwards;"></div>

</div>
