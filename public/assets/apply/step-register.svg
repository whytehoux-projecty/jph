<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
    path, rect, circle, polyline {
      fill: none;
      stroke: #F3EEE3;
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .accent {
      stroke: #DB4429;
    }
    .animated {
      stroke-dasharray: 400;
      stroke-dashoffset: 0;
    }
    svg:hover .animated {
      animation: drawIn 0.6s ease-in-out forwards;
    }
    @keyframes drawIn {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
  </style>
  <!-- Arched doorway -->
  <path class="animated" d="M32 104 L32 64 C32 46.3 46.3 32 64 32 C81.7 32 96 46.3 96 64 L96 104" />
  <path class="animated" d="M24 104 L104 104" />
  <path class="animated" d="M40 104 L40 64 C40 50.7 50.7 40 64 40 C77.3 40 88 50.7 88 64 L88 104" />
  <!-- Key -->
  <circle class="animated" cx="64" cy="64" r="6" />
  <path class="animated" d="M64 70 L64 86 M64 80 L70 80 M64 84 L68 84" />
  <!-- Vermilion check -->
  <path class="animated accent" d="M84 76 L90 82 L102 68" stroke-width="3" />
</svg>
