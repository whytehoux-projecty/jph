<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
    path, rect, circle, polyline {
      fill: none;
      stroke: #F3EEE3;
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s ease-in-out;
    }
    .accent {
      stroke: #DB4429;
    }
    .animated {
      stroke-dasharray: 300;
      stroke-dashoffset: 0;
    }
    svg:hover .animated {
      animation: drawIn 0.6s ease-in-out forwards;
    }
    @keyframes drawIn {
      0% { stroke-dashoffset: 300; }
      100% { stroke-dashoffset: 0; }
    }
  </style>
  <!-- Document -->
  <path class="animated" d="M36 24 L76 24 L92 40 L92 104 C92 108 88 112 84 112 L36 112 C32 112 28 108 28 104 L28 32 C28 28 32 24 36 24 Z" />
  <path class="animated" d="M76 24 L76 40 L92 40" />
  <!-- ID Card -->
  <rect class="animated" x="16" y="70" width="40" height="26" rx="4" />
  <circle class="animated" cx="28" cy="83" r="4" />
  <path class="animated" d="M40 80 L48 80 M40 86 L48 86" />
  <!-- Pin (Vermilion) -->
  <path class="animated accent" d="M84 76 C84 81 76 90 76 90 C76 90 68 81 68 76 C68 71.58 71.58 68 76 68 C80.42 68 84 71.58 84 76 Z" />
  <circle class="animated accent" cx="76" cy="76" r="2" />
</svg>
